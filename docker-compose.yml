services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 85.193.93.193
      - 85.193.93.194
    environment:
      PORT: 3001
      FRONTEND_ORIGIN: https://pixipod.ru
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      LEADS_TO_EMAIL: ${LEADS_TO_EMAIL}

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 85.193.93.193
      - 85.193.93.194
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
